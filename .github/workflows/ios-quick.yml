name: iOS Quick Build (unsigned IPA)

# 只做三件事：装 CocoaPods 依赖 -> xcodebuild 编译 -> 上传 unsigned IPA
# 不跑仓库里的单元/一致性测试。改到协议层、需要完整回归时，先在网页上启用
# 官方 release-ios.yml，手动跑一次再禁用。
#
# 纯手动：没有任何 push / PR 触发，只在 Actions 页面点 Run workflow 才跑。
# 这样推代码不会自动占用构建时间，要出包装机时再手动点。

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的分支（留空则用当前分支）'
        required: false
        default: ''
      note:
        description: '本次改动备注（会写进 artifact 文件名）'
        required: false
        default: 'build'

permissions:
  contents: read

concurrency:
  group: motonav-ios-quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26          # 与官方工作流一致；若提示该 label 不可用，改成 macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 1

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Restore CocoaPods cache
        uses: actions/cache/restore@v4
        id: pods
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ios-pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}

      - name: Install CocoaPods 1.16.2
        run: sudo gem install cocoapods -v 1.16.2 --no-document

      - name: pod install (deployment)
        timeout-minutes: 12
        working-directory: ios
        run: pod _1.16.2_ install --deployment

      - name: Save CocoaPods cache
        # 命中缓存时不能再存一次：同 key 重复保存会报 "cache already exists" 并让整个 job 失败
        if: success() && steps.pods.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ios-pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}

      - name: Build unsigned IPA
        env:
          MOTONAV_DERIVED_DATA: ${{ runner.temp }}/Derived
        run: |
          set -o pipefail
          bash scripts/build-ios-ipa.sh | tee build-ios.log

      - name: Collect outputs
        id: out
        run: |
          set -euo pipefail
          IPA=$(ls output/ios/*.ipa | head -1)
          BASE=$(basename "$IPA")
          NOTE="${{ inputs.note }}"
          NOTE=${NOTE:-build}
          # 文件名加上备注和 run 号，方便在 artifact 列表里区分第几次构建
          NEW="MotoNav-$(echo "$BASE" | sed 's/^MotoNav-//; s/\.ipa$//')-${NOTE}-r${{ github.run_number }}.ipa"
          cp "$IPA" "output/ios/$NEW"
          shasum -a 256 "output/ios/$NEW" | tee output/ios/SHA256SUMS.txt
          echo "ipa=$NEW" >> "$GITHUB_OUTPUT"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.out.outputs.ipa || 'MotoNav-ipa-failed' }}
          path: |
            output/ios/*.ipa
            output/ios/SHA256SUMS.txt
            build-ios.log
          if-no-files-found: warn
          retention-days: 15
